apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpserver
  labels:
    app: httpserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpserver
  template:
    metadata:
      name: httpserver
      labels:
        app: httpserver
    spec:
      containers:
        - name: httpserver
          image: mein-httpserver
          imagePullPolicy: Always
          env:
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "vts-vt-single-server.monitoring.svc.cluster.local:10428"
          ports:
          - name: http-metrics
            containerPort: 8080
            protocol: TCP
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: httpserver-svc
  namespace: default
  labels:
    app: httpserver
spec:
  type: NodePort
  selector:
    app: httpserver
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
      nodePort: 30080
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: httpserver-scrape
  namespace: default
spec:
  selector:
    matchLabels:
      app: httpserver
  endpoints:
  - port: http-metrics
    path: /metrics
    interval: 5s
